name: Windows Defender package review
on:
  workflow_dispatch:
permissions: {}
jobs:
  review:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Scan published package without executing extension code
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $review = Join-Path $env:RUNNER_TEMP ('got-you-review-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $review | Out-Null
          $zip = Join-Path $review 'got-you-v4.3.0.zip'
          $expected = '91b7b27588ceb17a22f5bd2d973c140ea7a67c1ba2c4a0e73c5b1b96d9cb83ad'
          $problem = $null
          $scanExit = $null
          $verified = $false
          try {
            $platform = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
            $scanner = if ($platform) { Join-Path $platform.FullName 'MpCmdRun.exe' } else { "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" }
            if (!(Test-Path $scanner)) { throw 'INCONCLUSIVE: Microsoft Defender scanner is unavailable.' }
            $passive = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Advanced Threat Protection'
            if (Test-Path $passive) { Set-ItemProperty -Path $passive -Name ForceDefenderPassiveMode -Value 0 }
            & $scanner -WdEnable
            Start-Service WinDefend
            Set-MpPreference -DisableArchiveScanning $false -DisableScriptScanning $false
            $excluded = @((Get-MpPreference).ExclusionPath | Where-Object { $_ })
            if ($excluded.Count -gt 0) { Remove-MpPreference -ExclusionPath $excluded }
            Update-MpSignature
            $status = Get-MpComputerStatus
            $status | Select-Object AMServiceEnabled,AntivirusEnabled,AMRunningMode,AMEngineVersion,AMProductVersion,AntivirusSignatureVersion,AntivirusSignatureLastUpdated | ConvertTo-Json
            if (!$status.AMServiceEnabled -or !$status.AntivirusEnabled) { throw 'INCONCLUSIVE: Defender antivirus is not active.' }
            if ($status.AntivirusSignatureLastUpdated -lt (Get-Date).AddDays(-1)) { throw 'INCONCLUSIVE: Defender signatures are stale.' }
            $preference = Get-MpPreference
            if ($preference.DisableArchiveScanning -or $preference.DisableScriptScanning -or @($preference.ExclusionPath | Where-Object { $_ }).Count -gt 0) { throw 'INCONCLUSIVE: Required files may be excluded from scanning.' }
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/YGDONER/-/d61574ff7d1010b6fb642ec282ef14223bc74477/got-you-v4.3.0.zip' -OutFile $zip
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
            Write-Host "Package SHA256: $hash"
            if ($hash -ne $expected) { throw 'INCONCLUSIVE: Download does not match the published package.' }
            Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $review 'unpacked')
            $extraPackages = @(
              @{ Name = 'source-v4.3.0.zip'; Hash = '250ff8e9798eaf6337c48abb7c1060a534fb147a139dfaea21a4e6d74be06b93' },
              @{ Name = 'got-you-store-v4.3.0.zip'; Hash = 'c4085646fd7fb02e623997ebfe05468a934b18e998d65d3bfa954d0832f7714b' }
            )
            foreach ($package in $extraPackages) {
              $file = Join-Path $review $package.Name
              Invoke-WebRequest -Uri ('https://raw.githubusercontent.com/YGDONER/-/d61574ff7d1010b6fb642ec282ef14223bc74477/' + $package.Name) -OutFile $file
              if ((Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant() -ne $package.Hash) { throw ('INCONCLUSIVE: Hash mismatch: ' + $package.Name) }
              Expand-Archive -LiteralPath $file -DestinationPath (Join-Path $review ($package.Name + '-unpacked'))
              Write-Host ('Verified package: ' + $package.Name + ' SHA256: ' + $package.Hash)
            }
            & $scanner -Scan -ScanType 3 -File $review
            $scanExit = $LASTEXITCODE
            $verified = (Test-Path $zip) -and ((Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant() -eq $expected)
          } catch {
            $problem = $_.Exception.Message
            Write-Host "Review error: $problem"
          }
          $records = @()
          $threats = @()
          try {
            $records = @(Get-MpThreatDetection -ErrorAction Stop | Where-Object { ($_.Resources -join ' ') -like "*$review*" })
            if ($records.Count -gt 0) { $threats = @(Get-MpThreat -ErrorAction Stop | Where-Object { $_.ThreatID -in $records.ThreatID }) }
          } catch {
            if (!$problem) { $problem = 'INCONCLUSIVE: Defender detection history could not be read. ' + $_.Exception.Message }
          }
          $records | Select-Object ThreatID,InitialDetectionTime,ActionSuccess,Resources | ConvertTo-Json -Depth 5
          $threats | Select-Object ThreatID,ThreatName,IsActive | ConvertTo-Json
          $summary = @('## Windows Defender package review','', 'Package: got-you-v4.3.0.zip',"Expected SHA256: $expected",'', 'Scope: isolated Windows Server runner; extension code was not executed. Cloud sample submission is not enabled by this workflow.','')
          if ($records.Count -gt 0) {
            $summary += 'Result: DETECTION RECORDED. Do not treat the package as cleared.'
            $summary += ($threats | ForEach-Object { 'Threat: ' + $_.ThreatName })
            $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            exit 1
          }
          if ($problem -or $scanExit -ne 0 -or !$verified) {
            $summary += "Result: INCONCLUSIVE. Scanner exit: $scanExit. Error: $problem"
            $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            exit 1
          }
          $summary += 'Result: No detections recorded by this runner under the logged engine and signature versions. This does not establish that a Windows 11 client will clear the download.'
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
